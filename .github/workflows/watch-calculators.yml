# Tells the owner when a file in github.com/mathiasboos/Calculators that one of the site's re-written calculators was ported
# from has changed (src/data/ported-sources.json lists them: Löneväxling, Nettolön and FIRE). Those calculators are React
# code and cannot be fetched like the Pensionsplaneraren and the Typfallsmodellen, which update themselves, so a change to
# their original has to be ported by hand.
#
# Every hour, and when started by hand (Actions → Bevaka Calculators → Run workflow), it compares the latest commit of each
# file with the one the port was checked against (scripts/check-ported-sources.mjs). For every file that has changed it opens
# an issue "Originalen har ändrats: <kalkylator>" (or updates the open one), and it closes the issue of a file whose port is up
# to date again. Nothing in the code is changed.
name: Bevaka Calculators

on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: watch-calculators
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare the originals with the ports
        shell: bash
        run: node scripts/check-ported-sources.mjs --json "$RUNNER_TEMP/ported.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Open, update and close issues
        uses: actions/github-script@v7
        env:
          RESULT: ${{ runner.temp }}/ported.json
        with:
          script: |
            const { readFileSync } = require("node:fs");
            const { issues } = JSON.parse(readFileSync(process.env.RESULT, "utf8"));
            const prefix = "Originalen har ändrats: ";
            const { owner, repo } = context.repo;
            const open = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", per_page: 100 }))
              .filter((issue) => !issue.pull_request && issue.title.startsWith(prefix));
            const wanted = new Set(issues.map((issue) => issue.title));
            for (const issue of issues) {
              const existing = open.find((o) => o.title === issue.title);
              if (existing) {
                if (existing.body !== issue.body) await github.rest.issues.update({ owner, repo, issue_number: existing.number, body: issue.body });
              } else {
                await github.rest.issues.create({ owner, repo, title: issue.title, body: issue.body });
              }
            }
            for (const issue of open.filter((o) => !wanted.has(o.title))) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: "Kalkylatorn är avstämd mot originalet igen." });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed", state_reason: "completed" });
            }
