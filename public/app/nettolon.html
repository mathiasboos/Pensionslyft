<style id="pensionslyft-theme">
/*
 * The look of a calculator from github.com/mathiasboos/Calculators on pensionslyft.se. The calculators that are shown
 * as they are already have the site's palette and fonts; the site only takes away what the page around them already
 * has: their own header (the name of the site, the SV | EN switch, "stand-alone version") and shows the file once its
 * language is set (scripts/apps-site.js). Every rule hangs on a stable name and does nothing if the file changes it.
 */
html:not(.pl-ready) body {
  visibility: hidden;
}
.lang-toggle,
.lang-bar,
header.top {
  display: none !important;
}
/* The frame is as high as the file; the file does not scroll inside it. */
html,
body {
  background: #ffffff;
  overflow-y: hidden;
}

/* The file's footer says that it is a stand-alone copy of the page on pensionslyft.se; on the site it is that page. The
   page says the same about estimates (src/pages/nettolonkalkylator.astro). */
footer {
  display: none;
}
</style>
<script id="pensionslyft-site">
/*
 * What pensionslyft.se adds to a calculator that it shows straight from github.com/mathiasboos/Calculators
 * (scripts/sync-apps.mjs puts it in the file's <head>).
 *
 * - The language is the site's: the page puts it in the address of the frame (?lang=sv or ?lang=en). When the file has
 *   started, its own switch is used to change to it (the file's SV | EN buttons are hidden on the site, whose own
 *   switch changes the page and with it the language of the frame). Until then the file stays hidden, so the wrong
 *   language does not flash; after 1.5 seconds it is shown whatever happens.
 * - A link in the file to the site opens in the whole window, and a link to another site in a new one, instead of
 *   replacing the calculator inside its frame.
 */
(function () {
  var root = document.documentElement;
  var wanted = /[?&]lang=(sv|en)\b/.exec(location.search);
  var lang = wanted ? wanted[1] : "sv";

  function show() {
    root.classList.add("pl-ready");
  }
  var fallback = setTimeout(show, 1500);

  function switchTo(code) {
    var buttons = document.querySelectorAll(".lang-btn");
    for (var i = 0; i < buttons.length; i++) {
      var button = buttons[i];
      var named = button.getAttribute("data-lang");
      var handler = button.getAttribute("onclick") || "";
      if (named === code || handler.indexOf("'" + code + "'") >= 0 || handler.indexOf('"' + code + '"') >= 0) {
        if (!button.classList.contains("active")) button.click();
        return;
      }
    }
    if (typeof window.setLang === "function") window.setLang(code);
  }

  function links() {
    var anchors = document.querySelectorAll("a[href]");
    for (var i = 0; i < anchors.length; i++) {
      var a = anchors[i];
      var href = a.getAttribute("href") || "";
      if (!/^https?:/i.test(href)) continue;
      var host = "";
      try {
        host = new URL(href).hostname;
      } catch (e) {
        continue;
      }
      if (host === "pensionslyft.se" || host === "www.pensionslyft.se") a.target = "_top";
      else {
        a.target = "_blank";
        a.rel = "noopener";
      }
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    // This handler was added before the file's own ones and runs first; the timeout lets them run before the switch.
    setTimeout(function () {
      try {
        switchTo(lang);
        links();
      } finally {
        clearTimeout(fallback);
        show();
      }
    }, 0);
  });
})();
</script>

<li>Aktievinster och -f\xF6rluster kvittas f\xF6rst fullt mot varandra i aktief\xE5llan. En <em>okvittad</em> aktief\xF6rlust kvoteras till ${c("70 %")} innan den f\xF6rs in i kapital.</li>
<li>\xD6verskott av kapital (r\xE4nta + utdelning + ISK/KF-schablonint\xE4kt + nettad aktievinst \u2212 r\xE4nteutgifter) beskattas med ${c("30 %")}.</li>
<li>Underskott av kapital ger skattereduktion: ${c("30 %")} upp till 100${NB}000${NB}kr, ${c("21 %")} p\xE5 den del som \xF6verstiger 100${NB}000${NB}kr.</li>
<li>ROT = 30 % av arbetskostnad (max 50${NB}000${NB}kr). RUT = 50 % (max 75${NB}000${NB}kr). Gemensamt tak 75${NB}000${NB}kr/\xE5r, varav h\xF6gst 50${NB}000${NB}kr ROT.</li></ul>
<h3>Kommunal fastighetsavgift</h3><ul>
<li>Sm\xE5hus: ${c("0,75 %")} av taxeringsv\xE4rdet, max takbelopp ${c("10" + NB + "425" + NB + "kr")} (inkomst\xE5r 2026). Taket sl\xE5r in vid taxeringsv\xE4rde 1${NB}390${NB}000${NB}kr.</li>
<li>Nybyggt med v\xE4rde\xE5r 2012 eller senare: ingen avgift de f\xF6rsta 15 \xE5ren.</li>
<li>Pension\xE4rsbegr\xE4nsning (66 \xE5r +): avgiften begr\xE4nsas till ${c("4 %")} av (BFI + kapital\xF6verskott), dock l\xE4gst sp\xE4rrbeloppet ${c("4" + NB + "042" + NB + "kr")}. Reduktionen ber\xE4knas f\xF6re \xF6vriga skattereduktioner.</li>
<li>Avr\xE4kningsordning: fastighetsavgiftsred. (pension\xE4r) \u2192 pensionsavgift \u2192 jobbskatteavdrag \u2192 f\xF6rv\xE4rvsinkomst \u2192 underskott av kapital \u2192 ROT/RUT. Fastighetsavgiften ing\xE5r i potten som de tv\xE5 sista f\xE5r kvittas mot; begravnings-/kyrkoavgift och allm\xE4n pensionsavgift g\xF6r det inte. Aldrig mer \xE4n kvarvarande skatt.</li>
<li>Modellen visar <em>skatteeffekten</em>. R\xE4ntekostnaden (kassautfl\xF6det) dras inte fr\xE5n nettot \u2014 som i Skatteverkets tj\xE4nst.</li></ul>
<h3>2026 \xE5rs parametrar</h3><ul>
<li>Prisbasbelopp 59${NB}200${NB}kr \xB7 Inkomstbasbelopp 83${NB}400${NB}kr</li>
