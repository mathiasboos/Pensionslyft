<style>

/*
 * The look of a calculator from github.com/mathiasboos/Calculators on pensionslyft.se. The calculators that are shown
 * as they are already have the site's palette and fonts; the site only takes away what the page around them already
 * has: their own header (the name of the site, the SV | EN switch, "stand-alone version") and shows the file once its
 * language is set (scripts/apps-site.js). Every rule hangs on a stable name and does nothing if the file changes it.
 */

  visibility: hidden;
}

<script id="pensionslyft-site">
/*
 * What pensionslyft.se adds to a calculator that it shows straight from github.com/mathiasboos/Calculators
 * (scripts/sync-apps.mjs puts it in the file's <head>).
 *
 * - The language is the site's: the page puts it in the address of the frame (?lang=sv or ?lang=en). When the file has
 *   started, its own switch is used to change to it (the file's SV | EN buttons are hidden on the site, whose own
 *   switch changes the page and with it the language of the frame). Until then the file stays hidden, so the wrong
 *   language does not flash; after 1.5 seconds it is shown whatever happens.
 * - A link in the file to the site opens in the whole window, and a link to another site in a new one, instead of
 *   replacing the calculator inside its frame.
 */
(function () {
  var root = document.documentElement;
  var wanted = /[?&]lang=(sv|en)\b/.exec(location.search);
  var lang = wanted ? wanted[1] : "sv";

  function show() {
    root.classList.add("pl-ready");
  }
  var fallback = setTimeout(show, 1500);

  function switchTo(code) {
    var buttons = document.querySelectorAll(".lang-btn");
    for (var i = 0; i < buttons.length; i++) {
      var button = buttons[i];
      var named = button.getAttribute("data-lang");
      var handler = button.getAttribute("onclick") || "";
      if (named === code || handler.indexOf("'" + code + "'") >= 0 || handler.indexOf('"' + code + '"') >= 0) {
        if (!button.classList.contains("active")) button.click();
        return;
      }
    }
    if (typeof window.setLang === "function") window.setLang(code);
  }

  function links() {
    var anchors = document.querySelectorAll("a[href]");
    for (var i = 0; i < anchors.length; i++) {
      var a = anchors[i];
      var href = a.getAttribute("href") || "";
      if (!/^https?:/i.test(href)) continue;
      var host = "";
      try {
        host = new URL(href).hostname;
      } catch (e) {
        continue;
      }
      if (host === "pensionslyft.se" || host === "www.pensionslyft.se") a.target = "_top";
      else {
        a.target = "_blank";
        a.rel = "noopener";
      }
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    // This handler was added before the file's own ones and runs first; the timeout lets them run before the switch.
    setTimeout(function () {
      try {
        switchTo(lang);
        links();
      } finally {
        clearTimeout(fallback);
        show();
      }
    }, 0);
  });
})();
</script>
<!-- pensionslyft:end -->

<script>
(() => {
  // ../../../../../../home/user/pensionslyft/src/lib/format.ts
  var sek = new Intl.NumberFormat("sv-SE", {
    style: "currency",
    currency: "SEK",
    maximumFractionDigits: 0
  });
  var num = new Intl.NumberFormat("sv-SE", { maximumFractionDigits: 0 });
  function formatSek(value) {
    return sek.format(Math.round(value));
  }
  var compact = new Intl.NumberFormat("sv-SE", { maximumFractionDigits: 1 });
  function groupDigits(text) {
    const cleaned = text.replace(/[^\d,.]/g, "");
    const point = cleaned.search(/[.,]/);
    const whole = (point === -1 ? cleaned : cleaned.slice(0, point)).replace(/\D/g, "").replace(/^0+(?=\d)/, "");
    const grouped = whole.replace(/\B(?=(\d{3})+(?!\d))/g, "\xA0");
    return point === -1 ? grouped : `${grouped},${cleaned.slice(point + 1).replace(/\D/g, "")}`;
  }
  function parseAmount(text) {
    return parseFloat(text.replace(/\s/g, "").replace(",", "."));
  }
  function stepValue(value, step, direction, min = 0, max = Infinity) {
    const position = Math.round(value / step * 1e9) / 1e9;
    const next = direction > 0 ? Math.floor(position) + 1 : Math.ceil(position) - 1;
    return Math.min(max, Math.max(min, next * step));
  }

  // lonevaxling.ts
  var YEAR = 2026;
  var LIMIT_AVGIFTSTAK = 56087;
  var LIMIT_BRYTPUNKT = 55033;
  var AG_PCT = 31.42 / 100;
  var SLP_PCT = 24.26 / 100;
  var PBB = 59200;
  var IBB = 83400;
  var MAX_SPARANDE_ANDEL = 0.35;
  var MAX_SPARANDE_PROCENT = MAX_SPARANDE_ANDEL * 100;
  var MAX_SPARANDE_PBB = 10 * PBB;
  var ITP1_GRENS1 = 7.5 * IBB / 12;
  var ITP1_GRENS2 = 30 * IBB / 12;
  var ITP1_PCT1 = 0.045;
  var ITP1_PCT2 = 0.3;
  var LON = { min: 3e4, max: 15e4, step: 500, typedMax: 5e5, start: 6e4 };
  var BELOPP = { min: 500, step: 100, typedMax: 2e5, start: 3e3 };
  var ALDER = { min: 18, max: 70, start: 40 };
  var PENSIONSALDER = { min: 55, max: 75, start: 67 };
  var AVKASTNING = { min: 0, max: 12, step: 0.5, start: 6 };
  var fmtKr = (n) => `${num.format(Math.round(n))}\xA0kr`;
  var fmtInt = (n) => num.format(Math.round(n));
  var fmtText = (n) => fmtInt(n).replace(/\u00a0/g, " ");
  var twoDecimals = new Intl.NumberFormat("sv-SE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var fmtRate = (rate) => twoDecimals.format(rate * 100);
  var oneDecimal = new Intl.NumberFormat("sv-SE", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  var fmtOneDecimal = (n) => oneDecimal.format(n);
  var fmtUplift = (n) => `${n.toLocaleString("sv-SE", { maximumFractionDigits: 1 })} %`;
  var disclaimer = (avkastning) => `Baserat p\xE5 ${avkastning.toLocaleString("sv-SE", { minimumFractionDigits: 1 })} % avkastning per \xE5r. Historisk avkastning \xE4r ingen garanti f\xF6r framtida avkastning.`;
  function itp1Avsattning(manadslon) {
    const d1 = Math.min(manadslon, ITP1_GRENS1);
    const d2 = Math.max(0, Math.min(manadslon, ITP1_GRENS2) - ITP1_GRENS1);
    return d1 * ITP1_PCT1 + d2 * ITP1_PCT2;
  }
  function maxVaxling(lon) {
    const arslon = lon * 12;
    const maxAr = Math.min(MAX_SPARANDE_ANDEL * arslon, MAX_SPARANDE_PBB);
    const itp1PerAr = itp1Avsattning(lon) * 12;
    const kvarAr = Math.max(0, maxAr - itp1PerAr);
    return Math.floor(kvarAr / 12 / 100) * 100;
  }
  var limitBelopp = (lon, belopp) => Math.min(belopp, maxVaxling(lon));
  function pensionPremie(belopp) {
    const agAvg = belopp * AG_PCT;
    const summa = belopp + agAvg;
    return summa / (1 + SLP_PCT);
  }
  function upliftPercent(belopp) {
    const faktor = belopp > 0 ? pensionPremie(belopp) / belopp : (1 + AG_PCT) / (1 + SLP_PCT);
    return (faktor - 1) * 100;
  }
  function simSeries(premie, grossPct, totalYears) {
    const netAnnual = Math.pow(1 + grossPct / 100, 1) - 1;
    const r = Math.pow(1 + Math.max(netAnnual, -0.99), 1 / 12) - 1;
    const pts = [0];
    let cap = 0;
    for (let y = 1; y <= totalYears; y++) {
      cap *= Math.pow(1 + r, 12);
      cap += r > 0 ? premie * ((Math.pow(1 + r, 12) - 1) / r) * (1 + r) : premie * 12;
      pts.push(cap);
    }
    return pts;
  }
  var fvAt = (premie, pct, yrs) => simSeries(premie, pct, yrs)[yrs];
  function suitability(lonEfter) {
    if (lonEfter > LIMIT_AVGIFTSTAK) {
      return {
        kind: "good",
        title: "L\xF6nev\xE4xling \xE4r l\xE4mpligt f\xF6r din l\xF6neniv\xE5 ",
        text: `L\xF6n efter v\xE4xling: ${fmtKr(lonEfter)}/m\xE5n \u2013 \xF6ver avgiftstaket och brytpunkten.`
      };
    }
    if (lonEfter > LIMIT_BRYTPUNKT) {
      return {
        kind: "amber",
        title: "Gr\xE4nsfall \u2013 din allm\xE4nna pension kan p\xE5verkas ",
        text: `L\xF6n efter v\xE4xling: ${fmtKr(lonEfter)}/m\xE5n. \xD6ver brytpunkten men under avgiftstaket.`
      };
    }
    return {
      kind: "warn",
      title: "L\xF6nev\xE4xling avr\xE5ds vid din l\xF6neniv\xE5 ",
      text: `L\xF6n efter v\xE4xling: ${fmtKr(lonEfter)}/m\xE5n \u2013 under avgiftstaket och brytpunkten.`
    };
  }
  function calcLonevaxling({ lon, belopp, alder, pensionsalder, avkastning }) {
    const premie = pensionPremie(belopp);
    const years = Math.max(1, pensionsalder - alder);
    const lonEfter = lon - belopp;
    const { kind, title, text } = suitability(lonEfter);
    return {
      tak: maxVaxling(lon),
      premie,
      uplift: upliftPercent(belopp),
      years,
      kapital: fvAt(premie, avkastning, years),
      inbetalt: premie * years * 12,
      lonEfter,
      suitability: kind,
      title,
      text
    };
  }

  // lv.ts
  var SOURCE_URL = "https://www.pensionsmyndigheten.se/forsta-din-pension/om-pensionssystemet/sa-beraknas-din-pension-basbelopp-berakningsfaktorer-och-varderegler";
  var state = { lon: LON.start, belopp: BELOPP.start, alder: ALDER.start, pensionsalder: PENSIONSALDER.start, avkastning: AVKASTNING.start };
  var $ = (id) => document.getElementById(id);
  var esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  function amountSlider(id, label, key, stepBy, min, max, step, suffix, hint = "") {
    return `<div class="field"><label for="${id}">${label}</label><div class="row">
    <button type="button" class="step" data-step="${key}" data-dir="-1" aria-label="Minska ${label.toLowerCase()} med ${num.format(stepBy)} kr">\u2212</button>
    <div class="num"><input id="${id}" data-key="${key}" data-stepby="${stepBy}" type="text" inputmode="numeric" autocomplete="off" /><span>${suffix}</span></div>
    <button type="button" class="step" data-step="${key}" data-dir="1" aria-label="\xD6ka ${label.toLowerCase()} med ${num.format(stepBy)} kr">+</button></div>
    <input id="${id}-r" class="rng" data-key="${key}" type="range" min="${min}" max="${max}" step="${step}" aria-label="${label}" style="margin-top:10px" />
    ${hint ? `<p class="hint" id="${id}-hint"></p>` : ""}</div>`;
  }
  function slider(id, label, key, min, max, step) {
    return `<div class="field"><div class="sliderhead"><label class="lab" for="${id}">${label}</label><output id="${id}-out" for="${id}"></output></div>
    <input id="${id}" class="rng" data-key="${key}" type="range" min="${min}" max="${max}" step="${step}" /></div>`;
  }
  $("app").innerHTML = `
  <form class="card inputs" onsubmit="return false" aria-label="Indata">
    ${amountSlider("lon", "M\xE5nadsl\xF6n f\xF6re skatt", "lon", 1e3, LON.min, LON.max, LON.step, "kr")}
    ${amountSlider("belopp", "Hur mycket vill du l\xF6nev\xE4xla?", "belopp", 100, BELOPP.min, 1e3, BELOPP.step, "kr/m\xE5n", "x")}
    ${slider("alder", "Din \xE5lder", "alder", ALDER.min, ALDER.max, 1)}
    ${slider("pensionsalder", "Planerad pensions\xE5lder", "pensionsalder", PENSIONSALDER.min, PENSIONSALDER.max, 1)}
    ${slider("avkastning", "F\xF6rv\xE4ntad avkastning per \xE5r", "avkastning", AVKASTNING.min, AVKASTNING.max, AVKASTNING.step)}
  </form>
  <div class="col">
    <div class="stats four" id="stats" aria-live="polite"></div>
    <div class="status" id="status" role="status"></div>
    <section class="card chart">
      <h2>S\xE5 v\xE4xer ditt sparande</h2>
      <p class="sub" id="chart-sub"></p>
      <ul class="legend" id="legend" style="margin-top:12px"></ul>
      <div class="plot" id="plot"><svg id="svg" viewBox="0 0 800 340" role="img" aria-label="Diagram \xF6ver hur sparandet v\xE4xer"></svg><div class="tooltip" id="tip"></div></div>
    </section>
    <div class="note" id="note"></div>
  </div>`;
  $("limits").innerHTML = `
  <h2>N\xE4r \xE4r l\xF6nev\xE4xling l\xE4mpligt?</h2>
  <p>L\xF6nev\xE4xling \xE4r som regel bara l\xE4mpligt om din m\xE5nadsl\xF6n <strong>efter v\xE4xling</strong> \xF6verstiger b\xE5da gr\xE4nserna nedan. Annars kan din pensionsgrundande inkomst och socialf\xF6rs\xE4kringsf\xF6rm\xE5ner p\xE5verkas.</p>
  <div class="g g3">
    <div class="lim"><b>${fmtText(LIMIT_AVGIFTSTAK)} kr/m\xE5n</b><span>Avgiftstaket i allm\xE4n pension. Under denna niv\xE5 minskar din intj\xE4ning till allm\xE4n pension.</span></div>
    <div class="lim"><b>${fmtText(LIMIT_BRYTPUNKT)} kr/m\xE5n</b><span>Brytpunkten f\xF6r statlig inkomstskatt. \xD6ver denna niv\xE5 \xE4r marginalskatten ~20 % h\xF6gre \u2013 l\xF6nev\xE4xling \xE4r extra f\xF6rm\xE5nlig.</span></div>
    <div class="lim"><b>Max ${MAX_SPARANDE_PROCENT} % av l\xF6n</b><span>Pensionssparande f\xE5r uppg\xE5 till h\xF6gst ${MAX_SPARANDE_PROCENT} % av din \xE5rsl\xF6n fr\xE5n anst\xE4llningen, dock aldrig mer \xE4n 10 prisbasbelopp (${fmtText(MAX_SPARANDE_PBB)} kr/\xE5r = ${fmtText(MAX_SPARANDE_PBB / 12)} kr/m\xE5n, PBB ${YEAR}: ${fmtText(PBB)} kr).</span></div>
  </div>
  <h3>Arbetsgivarens ITP1-avs\xE4ttning p\xE5 din l\xF6n</h3>
  <div class="g g2">
    <div class="lim"><b>4,5 % upp till 7,5 IBB</b><span>P\xE5 l\xF6nedelar upp till 7,5 inkomstbasbelopp (${fmtText(ITP1_GRENS1)} kr/m\xE5n, IBB ${YEAR}: ${fmtText(IBB)} kr) s\xE4tter arbetsgivaren in 4,5 %.</span></div>
    <div class="lim"><b>30 % mellan 7,5\u201330 IBB</b><span>P\xE5 l\xF6nedelar mellan 7,5 och 30 IBB (${fmtText(ITP1_GRENS1)}\u2013${fmtText(ITP1_GRENS2)} kr/m\xE5n) s\xE4tter arbetsgivaren in 30 %. \xD6ver 30 IBB g\xF6rs ingen avs\xE4ttning.</span></div>
  </div>
  <p>K\xE4lla: <a href="${SOURCE_URL}" target="_blank" rel="noopener">Pensionsmyndigheten</a>.</p>`;
  $("foot").innerHTML = `Kalkylatorn \xE4r ett f\xF6renklat ber\xE4kningsverktyg och utg\xF6r inte finansiell r\xE5dgivning. Ber\xE4kningarna bygger p\xE5 arbetsgivaravgift ${fmtRate(AG_PCT)} % och s\xE4rskild l\xF6neskatt ${fmtRate(SLP_PCT)} %. Historisk avkastning \xE4r inte en garanti f\xF6r framtida avkastning. Den h\xE4r filen \xE4r en frist\xE5ende kopia av <a href="https://pensionslyft.se/lonevaxlingskalkylator">L\xF6nev\xE4xlingskalkylatorn p\xE5 pensionslyft.se</a>, d\xE4r du alltid hittar den senaste versionen.`;
  var display = {
    alder: (v) => `${v} \xE5r`,
    pensionsalder: (v) => `${v} \xE5r`,
    avkastning: (v) => `${fmtOneDecimal(v)} %`
  };
  function constrain(changed) {
    const s = state;
    if (changed === "lon") s.belopp = limitBelopp(s.lon, s.belopp);
    if (changed === "belopp") s.belopp = limitBelopp(s.lon, s.belopp);
    if (changed === "alder" && s.pensionsalder <= s.alder) s.pensionsalder = s.alder + 1;
    if (changed === "pensionsalder" && s.pensionsalder <= s.alder) s.pensionsalder = s.alder + 1;
  }
  function syncInputs() {
    const tak = maxVaxling(state.lon);
    $("belopp-r").max = String(Math.max(tak, BELOPP.min));
    document.querySelectorAll("input.rng").forEach((input) => {
      const key = input.dataset.key;
      input.value = String(state[key]);
      const out = document.getElementById(`${input.id}-out`);
      if (out) out.textContent = display[key](state[key]);
    });
    for (const [id, key] of [["lon", "lon"], ["belopp", "belopp"]]) {
      const el = $(id);
      if (document.activeElement !== el) el.value = groupDigits(String(Math.round(state[key])));
    }
    $("belopp-hint").innerHTML = `Tak f\xF6r l\xF6nev\xE4xling: <strong>${fmtInt(tak)} kr/m\xE5n</strong>. Pensionssparande f\xE5r uppg\xE5 till max ${MAX_SPARANDE_PROCENT} % av \xE5rsl\xF6nen, dock h\xF6gst 10 prisbasbelopp (${fmtText(MAX_SPARANDE_PBB)} kr/\xE5r). Det l\xE4gsta av gr\xE4nserna avg\xF6r ditt tak.`;
  }
  var last;
  function render() {
    const s = state;
    const r = calcLonevaxling(s);
    const selected = fmtOneDecimal(s.avkastning);
    $("stats").innerHTML = [
      ["Ditt m\xE5nadssparande", fmtKr(r.premie), `Inklusive ${fmtUplift(r.uplift)} som arbetsgivaren skjuter till`, "hl"],
      [`Extra pensionskapital om ${r.years} \xE5r`, fmtKr(r.kapital), "", "hl"],
      ["Inbetalt kapital", fmtKr(r.inbetalt), "", ""],
      ["Varav avkastning", fmtKr(r.kapital - r.inbetalt), "", ""]
    ].map(([l, v, n, c]) => `<div class="stat ${c}"><div class="eyebrow">${esc(l)}</div><div class="v">${v}</div>${n ? `<div class="n">${esc(n)}</div>` : ""}</div>`).join("");
    const icon = { good: "\u2713", amber: "!", warn: "\u2715" }[r.suitability];
    const st = $("status");
    st.className = `status ${r.suitability}`;
    st.innerHTML = `<span class="ic" aria-hidden="true">${icon}</span><p style="margin:0"><b>${esc(r.title)}</b>${esc(r.text)}</p>`;
    $("chart-sub").innerHTML = `Utveckling fram till pension vid <strong>${selected} %</strong> avkastning per \xE5r.`;
    $("legend").innerHTML = `<li><i style="background:#a18142"></i>Inbetalt kapital</li><li><i style="background:#0c2a49"></i>V\xE4rde vid ${selected} %</li>`;
    $("note").innerHTML = `Arbetsgivaren betalar l\xE4gre l\xF6neskatt p\xE5 pensionspremier (${fmtRate(SLP_PCT)} %) \xE4n arbetsgivaravgift p\xE5 l\xF6n (${fmtRate(AG_PCT)} %). Skillnaden l\xE4ggs ovanp\xE5 din pensionspremie. ${esc(disclaimer(s.avkastning))}`;
    const capital = simSeries(r.premie, s.avkastning, r.years);
    const deposits = capital.map((_, y) => r.premie * y * 12);
    last = { years: r.years, deposits, capital, label: selected };
    draw(last);
  }
  function niceStep(raw) {
    if (raw <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= raw) return m * p;
    return 10 * p;
  }
  function draw(p) {
    const W = Math.max(300, Math.min(800, $("plot").clientWidth || 800));
    const H = W < 520 ? 290 : 340, L = 70, R = 12, T = 14, B = 28;
    $("svg").setAttribute("viewBox", `0 0 ${W} ${H}`);
    const n = p.capital.length;
    const hi = Math.max(...p.capital, 1);
    const step = niceStep(hi / 5);
    const yMax = Math.ceil(hi / step) * step;
    const x = (i) => L + (n === 1 ? 0.5 : i / (n - 1)) * (W - L - R);
    const y = (v) => T + (1 - v / yMax) * (H - T - B);
    let out = `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0c2a49" stop-opacity="0.45"/><stop offset="100%" stop-color="#0c2a49" stop-opacity="0.02"/></linearGradient></defs>`;
    for (let v = 0; v <= yMax + 1e-6; v += step) out += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-dasharray="3 3"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${esc(`${num.format(v / 1e3)} tkr`)}</text>`;
    const every = Math.max(1, Math.ceil(n / 7));
    for (let i = 0; i < n; i += every) out += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${i === 0 ? "Idag" : `+${i} \xE5r`}</text>`;
    const line = (vals) => vals.map((v, i) => `${i ? "L" : "M"}${x(i)},${y(v)}`).join(" ");
    const area = (vals) => `${line(vals)} L${x(n - 1)},${y(0)} L${x(0)},${y(0)} Z`;
    out += `<path d="${area(p.deposits)}" fill="#a18142" fill-opacity="0.15"/><path d="${line(p.deposits)}" fill="none" stroke="#a18142" stroke-width="1.5" stroke-dasharray="6 4"/>`;
    out += `<path d="${area(p.capital)}" fill="url(#g)"/><path d="${line(p.capital)}" fill="none" stroke="#0c2a49" stroke-width="2" stroke-linejoin="round"/>`;
    out += `<line id="cursor" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted-fg)" stroke-opacity="0.6" visibility="hidden"/>`;
    $("svg").innerHTML = out;
    const svg = $("svg"), tip = $("tip");
    const cursor = svg.querySelector("#cursor");
    const show = (clientX) => {
      const box = svg.getBoundingClientRect();
      const sx = (clientX - box.left) / box.width * W;
      const i = Math.min(n - 1, Math.max(0, Math.round((sx - L) / (W - L - R) * (n - 1))));
      cursor.setAttribute("x1", String(x(i)));
      cursor.setAttribute("x2", String(x(i)));
      cursor.setAttribute("visibility", "visible");
      tip.innerHTML = `<b>${i === 0 ? "Idag" : `Om ${i} \xE5r`}</b>
      <div class="t"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#a18142;margin-right:6px"></i>Inbetalt kapital</span><span>${esc(formatSek(p.deposits[i]))}</span></div>
      <div class="t"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#0c2a49;margin-right:6px"></i>V\xE4rde vid ${p.label} %</span><span>${esc(formatSek(p.capital[i]))}</span></div>`;
      tip.style.display = "block";
      const px = x(i) / W * box.width;
      tip.style.left = `${px > box.width / 2 ? px - tip.offsetWidth - 12 : px + 12}px`;
      tip.style.top = "8px";
    };
    const hide = () => {
      tip.style.display = "none";
      cursor.setAttribute("visibility", "hidden");
    };
    svg.onpointermove = (e) => show(e.clientX);
    svg.onpointerdown = (e) => show(e.clientX);
    svg.onpointerleave = hide;
  }
  document.querySelectorAll("input[data-key]").forEach((input) => {
    const key = input.dataset.key;
    input.addEventListener("input", () => {
      if (input.type === "range") state[key] = parseFloat(input.value);
      else {
        input.value = groupDigits(input.value);
        const v = parseAmount(input.value);
        state[key] = Number.isFinite(v) ? Math.max(0, v) : 0;
      }
      constrain(key);
      syncInputs();
      render();
    });
    input.addEventListener("blur", () => {
      if (input.type === "range") return;
      if (key === "lon") state.lon = Math.min(Math.max(state.lon, 0), LON_TYPED_MAX);
      if (key === "belopp") state.belopp = Math.max(state.belopp, BELOPP.min);
      constrain(key);
      syncInputs();
      render();
    });
  });
  var LON_TYPED_MAX = LON.typedMax;
  document.querySelectorAll("button.step").forEach((button) => {
    const key = button.dataset.step;
    const dir = Number(button.dataset.dir);
    const input = document.querySelector(`input[type=text][data-key="${key}"]`);
    const stepBy = Number(input.dataset.stepby);
    const go = () => {
      const shown2 = parseAmount(input.value);
      const next = stepValue(Number.isFinite(shown2) ? shown2 : 0, stepBy, dir, 0, key === "belopp" ? maxVaxling(state.lon) : void 0);
      state[key] = next;
      constrain(key);
      syncInputs();
      render();
    };
    let timer, repeat;
    const stop = () => {
      window.clearTimeout(timer);
      window.clearInterval(repeat);
    };
    button.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      go();
      timer = window.setTimeout(() => repeat = window.setInterval(go, 80), 450);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => button.addEventListener(ev, stop));
    button.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        go();
      }
    });
  });
  syncInputs();
  render();
  var shown = $("plot").clientWidth;
  new ResizeObserver(() => {
    const w = $("plot").clientWidth;
    if (w !== shown && last) {
      shown = w;
      draw(last);
    }
  }).observe($("plot"));
})();

</script>
</body>
</html>
